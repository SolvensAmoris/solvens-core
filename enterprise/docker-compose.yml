# SOLVENS Enterprise - Self-Hosted Deployment
# Zero-internet required. Full stack runs in your VPC.

version: '3.9'

services:
  # Core API Server
  solvens-api:
    image: solvens/core:latest
    container_name: solvens-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SOLVENS_API_PORT=8000
      - SOLVENS_API_HOST=0.0.0.0
      - SOLVENS_POSTGRES_URL=postgresql://solvens:solvens_secure_pass@postgres:5432/solvens
      - SOLVENS_REDIS_URL=redis://redis:6379/0
      - SOLVENS_STORAGE_ENDPOINT=minio:9000
      - SOLVENS_STORAGE_ACCESS_KEY=minioadmin
      - SOLVENS_STORAGE_SECRET_KEY=minioadmin_secure
      - SOLVENS_STORAGE_BUCKET=solvens-artifacts
      - SOLVENS_SECRET_KEY=${SOLVENS_SECRET_KEY}
      - SOLVENS_LICENSE_KEY=${SOLVENS_LICENSE_KEY}
      - SOLVENS_SSO_ENABLED=false
      - SOLVENS_AUDIT_LOG_ENABLED=true
      - SOLVENS_PII_REDACTION_STRICT=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./data/solvens:/data
      - ./audit-logs:/audit:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - solvens-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # Dashboard UI
  solvens-dashboard:
    image: solvens/dashboard:latest
    container_name: solvens-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://solvens-api:8000
      - NEXT_PUBLIC_WS_URL=ws://solvens-api:8000
    depends_on:
      - solvens-api
    networks:
      - solvens-net

  # PostgreSQL - Metadata + Audit Logs
  postgres:
    image: postgres:16-alpine
    container_name: solvens-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=solvens
      - POSTGRES_USER=solvens
      - POSTGRES_PASSWORD=solvens_secure_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_worker_processes=8
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solvens"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solvens-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  # Redis - Cache + Queues
  redis:
    image: redis:7-alpine
    container_name: solvens-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solvens-net

  # Ollama - Local LLM (default)
  ollama:
    image: ollama/ollama:latest
    container_name: solvens-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2
    networks:
      - solvens-net
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 16G

  # MinIO - S3-Compatible Storage
  minio:
    image: minio/minio:latest
    container_name: solvens-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin_secure
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - solvens-net

  # Prometheus - Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: solvens-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - solvens-net

  # Grafana - Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: solvens-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - solvens-net

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  ollama-data:
    driver: local
  minio-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  solvens-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
