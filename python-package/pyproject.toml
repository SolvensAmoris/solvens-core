[project]
name = "cosmos-language"
version = "1.0.0"
description = "Cosmos DSL Language Server - LSP for VSCode and IDE integration"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Luis Alberto Burciaga Miker", email = "luis@solvens.amoris"}
]
requires-python = ">=3.11"
keywords = ["cosmos", "dsl", "lsp", "language-server", "vscode", "ide", "compiler"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pydantic>=2.5.0",
    "python-lsp-server>=1.11.0",
    "pygls>=1.1.0",
]

[project.optional-dependencies]
all = [
    "cosmos-language[pyright,ruff,mypy]",
]
pyright = ["pyright>=1.1.350"]
ruff = ["ruff>=0.1.0"]
mypy = ["mypy>=1.8.0"]

[project.scripts]
cosmos-language-server = "cosmos_language.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cosmos_language"]

[tool.hatch.build.targets.sdist]
include = [
    "/cosmos_language",
    "/README.md",
    "/LICENSE",
]
