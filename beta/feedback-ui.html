<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmos Engine - Beta Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0f;
            color: #f0f0f5;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 {
            font-size: 32px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #8888a0; margin-bottom: 40px; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: #12121a;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 24px;
        }
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #6366f1;
        }
        .stat-label {
            color: #8888a0;
            font-size: 14px;
            margin-top: 4px;
        }
        
        .section {
            background: #12121a;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .section h2 {
            font-size: 20px;
            margin-bottom: 16px;
            color: #fff;
        }
        
        .feedback-item {
            padding: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .feedback-item:last-child { border-bottom: none; }
        .feedback-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .feedback-rating {
            font-size: 20px;
        }
        .feedback-meta {
            color: #5a5a70;
            font-size: 12px;
        }
        .feedback-task {
            color: #8888a0;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .feedback-comment {
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            color: #a0a0b0;
        }
        
        .success-rate {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .rate-bar {
            flex: 1;
            height: 8px;
            background: #1a1a25;
            border-radius: 4px;
            overflow: hidden;
        }
        .rate-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #6366f1);
            border-radius: 4px;
        }
        .rate-text {
            font-size: 24px;
            font-weight: 700;
            color: #22c55e;
        }
        
        .issues-list {
            list-style: none;
        }
        .issue-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .issue-count {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 14px;
        }
        
        .empty {
            text-align: center;
            padding: 40px;
            color: #5a5a70;
        }
        
        .nav {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }
        .nav a {
            color: #8888a0;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav a:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }
        .nav a.active {
            color: #6366f1;
            background: rgba(99, 102, 241, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cosmos Engine</h1>
        <p class="subtitle">Beta Dashboard</p>
        
        <nav class="nav">
            <a href="#" class="active">Overview</a>
            <a href="#waitlist">Waitlist</a>
            <a href="#feedback">Feedback</a>
        </nav>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalRuns">0</div>
                <div class="stat-label">Total Runs</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="successRate">0%</div>
                <div class="stat-label">Success Rate</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgDuration">0ms</div>
                <div class="stat-label">Avg Duration</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalCost">$0</div>
                <div class="stat-label">Total Cost</div>
            </div>
        </div>
        
        <div class="section">
            <h2>📊 Success Rate</h2>
            <div class="success-rate">
                <span class="rate-text" id="ratePercent">0%</span>
                <div class="rate-bar">
                    <div class="rate-fill" id="rateFill" style="width: 0%"></div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <h2>🔴 Top Issues</h2>
            <ul class="issues-list" id="issuesList">
                <li class="empty">No issues recorded yet</li>
            </ul>
        </div>
        
        <div class="section">
            <h2>💬 Recent Feedback</h2>
            <div id="feedbackList">
                <div class="empty">No feedback yet. Share the beta!</div>
            </div>
        </div>
    </div>
    
    <script>
        // Load data from localStorage (set by landing page)
        function loadDashboard() {
            // Get telemetry data
            const telemetry = JSON.parse(localStorage.getItem('cosmos_telemetry') || '[]');
            const feedback = JSON.parse(localStorage.getItem('cosmos_feedback') || '[]');
            const waitlist = JSON.parse(localStorage.getItem('cosmos_waitlist') || '[]');
            
            // Update stats
            const totalRuns = telemetry.length;
            const successful = telemetry.filter(t => t.status === 'completed').length;
            const successRate = totalRuns > 0 ? (successful / totalRuns * 100).toFixed(1) : 0;
            const durations = telemetry.map(t => t.duration_ms).filter(d => d > 0);
            const avgDuration = durations.length > 0 ? (durations.reduce((a,b) => a+b, 0) / durations.length).toFixed(0) : 0;
            const totalCost = telemetry.reduce((sum, t) => sum + (t.cost || 0), 0).toFixed(4);
            
            document.getElementById('totalRuns').textContent = totalRuns;
            document.getElementById('successRate').textContent = successRate + '%';
            document.getElementById('avgDuration').textContent = avgDuration + 'ms';
            document.getElementById('totalCost').textContent = '$' + totalCost;
            document.getElementById('ratePercent').textContent = successRate + '%';
            document.getElementById('rateFill').style.width = successRate + '%';
            
            // Top issues
            const errors = telemetry.filter(t => t.status === 'failed');
            const errorCounts = {};
            errors.forEach(e => {
                const type = e.error_type || 'unknown';
                errorCounts[type] = (errorCounts[type] || 0) + 1;
            });
            
            const issuesList = document.getElementById('issuesList');
            if (Object.keys(errorCounts).length > 0) {
                issuesList.innerHTML = Object.entries(errorCounts)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 5)
                    .map(([type, count]) => `
                        <li class="issue-item">
                            <span>${type}</span>
                            <span class="issue-count">${count}</span>
                        </li>
                    `).join('');
            }
            
            // Recent feedback
            const feedbackList = document.getElementById('feedbackList');
            if (feedback.length > 0) {
                feedbackList.innerHTML = feedback.slice(-5).reverse().map(f => `
                    <div class="feedback-item">
                        <div class="feedback-header">
                            <span class="feedback-rating">${f.rating === 'thumbs_up' ? '👍' : '👎'}</span>
                            <span class="feedback-meta">${new Date(f.created_at * 1000).toLocaleDateString()}</span>
                        </div>
                        <div class="feedback-task">${f.task}</div>
                        ${f.comment ? `<div class="feedback-comment">${f.comment}</div>` : ''}
                    </div>
                `).join('');
            }
        }
        
        loadDashboard();
    </script>
</body>
</html>
