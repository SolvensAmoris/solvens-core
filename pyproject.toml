[project]
name = "solvens-core"
version = "0.4.5-rc1"
description = "AI Operating System - Modular kernel for intelligent agents with Cosmos DAG support"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Luis Alberto Burciaga Miker", email = "luis@solvens.amoris"}
]
requires-python = ">=3.11"
keywords = ["ai", "agents", "orchestration", "llm", "gpt", "claude", "cosmos", "dag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
    "typing-extensions>=4.9.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]
cli = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]
storage = [
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
]
vector = [
    "numpy>=1.26.0",
    "chromadb>=0.5.0",
    "networkx>=3.0",
    "sentence-transformers>=3.0",
]
cosmos = [
    "solvens-core[api,cli,storage,vector]",
]
all = [
    "solvens-core[api,cli,storage,vector]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
solvens = "solvens.cli.main:app"

[project.entry-points."solvens.agents"]
cosmos = "cosmos.solvens_agent:CosmosCompilerAgent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solvens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
