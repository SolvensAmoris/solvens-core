name: Dashboard web build

on:
  push:
    branches: [main]
    paths:
      - "dashboard/web/**"
      - ".github/workflows/dashboard-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "dashboard/web/**"
      - ".github/workflows/dashboard-build.yml"

permissions:
  contents: read

jobs:
  dashboard-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Report dependency advisories
        run: |
          npm audit --json > audit-report.json || true
          node -e 'const audit=require("./audit-report.json"); for (const [name, item] of Object.entries(audit.vulnerabilities || {})) { const via=(item.via || []).map(v => typeof v === "string" ? v : v.title + " " + v.url).join(" | "); console.log(name + ": severity=" + item.severity + "; range=" + item.range + "; fix=" + JSON.stringify(item.fixAvailable) + "; via=" + via); }'
      - name: Type-check dashboard
        run: npx tsc --noEmit
      - name: Build dashboard
        run: npm run build
